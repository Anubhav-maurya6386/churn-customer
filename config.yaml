# Central configuration. Money values are in your own currency (INR, USD, ...).
project:
  name: churn-prediction
  version: 2.0.0
  seed: 42

data:
  raw_path: data/raw/customers.csv
  id_col: customer_id
  target: churn
  test_size: 0.2
  n_synthetic: 8000

model:
  cv_folds: 5
  search_iter: 5            # random-search trials per model family
  calibration_method: isotonic

# Business economics: decides WHO is worth contacting (not just who is risky)
business:
  horizon_months: 24        # value of a saved customer over this many months
  gross_margin: 0.35
  offer_cost: 40.0          # cost of one retention offer / call
  offer_success_rate: 0.30  # share of at-risk customers an offer actually saves

risk_tiers:
  high: 0.50
  medium: 0.25

fairness:
  groups: [gender, senior_citizen]

drift:
  psi_warn: 0.10
  psi_alert: 0.25
